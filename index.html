<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ST午後Ⅰ 高速演習</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a2230;--sub:#5b6577;--line:#dde2ea;--accent:#1f4e8c;--ok:#1d8a4e;--mid:#c58a00;--ng:#c43b3b;--hl:#fff7d6;--cm:#e6f4ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--card:#1a2029;--ink:#e6e9ef;--sub:#9aa4b5;--line:#2c3440;--accent:#6ea3ec;--ok:#4cc184;--mid:#e3b341;--ng:#ef6b6b;--hl:#3a3216;--cm:#1d3326}}
:root[data-theme="dark"]{--bg:#11151c;--card:#1a2029;--ink:#e6e9ef;--sub:#9aa4b5;--line:#2c3440;--accent:#6ea3ec;--ok:#4cc184;--mid:#e3b341;--ng:#ef6b6b;--hl:#3a3216;--cm:#1d3326}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gauge{flex:1;min-width:230px}
.gauge .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:0 4px}
.gauge .lab b{color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.spd{font-weight:700;font-size:13px;white-space:nowrap}
.spd small{display:block;font-weight:400;color:var(--sub)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.menu button{padding:4px 10px;font-size:13px}
.prog{font-size:13px;color:var(--sub);margin-top:4px}
.prog b.o{color:var(--ok)}.prog b.t{color:var(--mid)}.prog b.x{color:var(--ng)}
.timer{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.hd{font-size:12px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--accent);color:#fff;margin-right:6px}
.q{white-space:pre-wrap;margin:8px 0}
.kw{font-size:13px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);white-space:pre-wrap}
textarea{width:100%;min-height:70px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.cnt{font-size:12px;color:var(--sub);text-align:right}
.judge{font-size:28px;font-weight:800}
.j-o{color:var(--ok)}.j-t{color:var(--mid)}.j-x{color:var(--ng)}
.blk{margin-top:10px}
.blk h4{margin:0;font-size:12px;color:var(--sub)}
.blk div{white-space:pre-wrap}
.ans{background:var(--hl);padding:8px 10px;border-radius:8px}
.cmn{background:var(--cm);padding:8px 10px;border-radius:8px;font-weight:600}
.miss span{display:inline-block;border:1px solid var(--ng);color:var(--ng);border-radius:6px;padding:0 6px;margin:2px 4px 2px 0;font-size:13px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btns button{flex:1;min-width:70px;font-size:17px;padding:8px}
.bo{color:var(--ok)}.bt{color:var(--mid)}.bx{color:var(--ng)}
.hint{font-size:12px;color:var(--sub);margin-top:8px}
.big{font-size:18px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.toast{background:var(--accent);color:#fff;border-radius:8px;padding:6px 12px;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="row">
    <div class="gauge">
      <div class="lab"><span>じっくり</span><span>標準</span><span>高速</span><span>超高速</span></div>
      <input id="speed" type="range" min="1" max="4" step="1" value="2" aria-label="速度ゲージ">
      <div class="lab"><b>1</b><b>2</b><b>3</b><b>4</b></div>
    </div>
    <div class="spd" id="spdLabel"></div>
  </div>
  <div class="row menu" style="margin-top:6px">
    <button data-m="A">A IPA解答</button>
    <button data-m="B">B 常識</button>
    <button data-m="C">C △×復習</button>
    <button id="btnSwitch">D 切替</button>
    <button id="btnEnd">E 終了・成績</button>
  </div>
  <div class="prog" id="prog"></div>
  <div class="timer"><i id="bar"></i></div>
</div></header>

<div class="wrap" id="main"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
